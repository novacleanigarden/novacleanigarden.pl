<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nova Clean i Garden | Sprzątanie, ogrody, samochody</title>

<meta name="description" content="Nova Clean i Garden – kompleksowe sprzątanie, czyszczenie samochodów, pielęgnacja ogrodów i mycie elewacji. Warszawa i okolice. Nie oceniamy. Sprzątamy.">

<style>
:root{
    --green:#163c31;
    --green-dark:#0d2922;
    --green-light:#2e6653;
    --mint:#dcefe8;
    --white:#ffffff;
    --gray:#f3f5f4;
    --gray-dark:#65716d;
    --text:#1c2724;
    --border:#dfe5e2;
    --shadow:0 12px 35px rgba(16,43,35,.09);
    --radius:20px;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#fff;
    color:var(--text);
    line-height:1.65;
}

a{
    color:inherit;
    text-decoration:none;
}

button{
    font-family:inherit;
}

.container{
    width:min(1160px,92%);
    margin:0 auto;
}

/* =========================================================
   HEADER
========================================================= */

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(255,255,255,.97);
    backdrop-filter:blur(12px);
    border-bottom:1px solid rgba(0,0,0,.06);
}

.navbar{
    min-height:78px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
    font-weight:800;
    color:var(--green);
    font-size:20px;
    white-space:nowrap;
}

.logo-mark{
    width:42px;
    height:42px;
    border-radius:13px;
    background:var(--green);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
    letter-spacing:-1px;
}

nav{
    display:flex;
    align-items:center;
    gap:22px;
}

nav a{
    font-size:14px;
    font-weight:600;
    color:#34423e;
    transition:.2s;
}

nav a:hover{
    color:var(--green-light);
}

.header-right{
    display:flex;
    align-items:center;
    gap:9px;
}

.contact-icon{
    width:38px;
    height:38px;
    border-radius:12px;
    background:var(--gray);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--green);
    transition:.2s;
    font-size:17px;
    cursor:pointer;
}

.contact-icon:hover{
    background:var(--mint);
    transform:translateY(-2px);
}

.clock{
    margin-left:7px;
    padding-left:14px;
    border-left:1px solid var(--border);
    font-size:11px;
    line-height:1.35;
    color:#697570;
    text-align:right;
    min-width:108px;
}

.header-info{
    display:flex;
    flex-direction:column;
